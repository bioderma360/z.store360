<style>
:root{--ink:#0c2a1b;--ink2:#14402a;--gold:#16a05a;--gold2:#3cc880;--red:#d3262e;--red2:#f0525a;--bg:#f2f7f4;--card:#fff;--line:#dde9e2;--muted:#5f6f66;--ok:#14803f;--warn:#9a6a00;--bad:#c0262d;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
h1{font-size:22px;margin:0 0 14px}h2{font-size:17px;margin:18px 0 10px}h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12.5px}.right{text-align:right}.nowrap{white-space:nowrap}.mono{font-family:ui-monospace,Menlo,monospace}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:99}
.toasts{position:fixed;right:12px;top:12px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:92vw}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;border-left:4px solid var(--gold);box-shadow:0 4px 16px #0003;max-width:380px}
.toast.err{border-left-color:#ff6b61}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:16px}
.login-card{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
.logo{font-weight:800;letter-spacing:.28em;font-size:20px;color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 0}
input,select,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid #cfcabd;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,.btn:focus{outline:2px solid var(--gold);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.btn{display:inline-block;padding:9px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ink2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:#bdb8a8}.btn.ghost:hover{background:#0000000a}
.btn.danger{background:var(--bad);border-color:var(--bad)}.btn.sm{padding:5px 9px;font-size:13px}.btn.block{width:100%;margin-top:16px}
#app{display:flex;min-height:100vh}
.side{width:230px;background:var(--ink);color:#eee;padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
.side .logo{color:var(--gold2);font-size:15px;padding:0 8px 14px}
.side a{display:block;padding:10px 12px;color:#d9d6cc;text-decoration:none;border-radius:8px;cursor:pointer;margin-bottom:2px}
.side a:hover{background:#ffffff14}.side a.on{background:var(--gold);color:#111;font-weight:700}
.side .grow{flex:1}.side .me{font-size:12.5px;color:#aaa;padding:8px}
.main{flex:1;min-width:0}.top{display:flex;align-items:center;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line)}
.who{margin-left:auto;font-size:13px;color:var(--muted)}.menu{display:none}
.demo{background:#fff3cd;color:#664d03;padding:4px 10px;border-radius:6px;font-weight:700;font-size:12px}
.view{padding:18px;max-width:1300px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.stat .v{font-size:23px;font-weight:700;margin-top:2px}
.stat.click{cursor:pointer;transition:box-shadow .12s,border-color .12s}.stat.click:hover,.stat.click:focus{border-color:var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.12);outline:none}.lnk{color:#1c4f9c;text-decoration:underline;cursor:pointer;font-weight:600}.lnk:hover{color:#b8923a}
.stat .b{font-size:11.5px;color:var(--muted);margin-top:2px}.stat.gold{border-top:3px solid var(--gold)}
.bar-f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:12px}
.bar-f>div{flex:1 1 150px;min-width:130px}.bar-f label{margin:0}.bar-f .grow2{flex:2 1 220px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th{background:#faf8f2;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0ede4;vertical-align:top}.tbl tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eee}
.chip.Pending,.chip.Unpaid,.chip.warn{background:#fff3cd;color:var(--warn)}.chip.Delivered,.chip.Paid,.chip.ok,.chip.Full{background:#d9f2e3;color:var(--ok)}
.chip.Return,.chip.bad,.chip.error{background:#fbdad7;color:var(--bad)}.chip.Partial{background:#e1ebfb;color:#1c4f9c}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0;flex-wrap:wrap}
.alert{padding:10px 12px;border-radius:8px;margin:10px 0;background:#fff3cd;color:#664d03}.alert.err{background:#fbdad7;color:#7a1c16}.alert.ok{background:#d9f2e3;color:#14532d}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;-webkit-overflow-scrolling:touch;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;border-top:4px solid var(--gold)}.modal.wide{max-width:980px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.modal .mh h3{margin:0;font-size:17px}
.modal .mb{padding:6px 18px 14px}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}
.pw{font:700 20px ui-monospace,Menlo,monospace;background:#faf8f2;border:1px dashed var(--gold);padding:12px;border-radius:8px;text-align:center;user-select:all;word-break:break-all}
.imp td.err{background:#fff1f0}.imp td.dup{background:#fff8e1}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;padding:20px;color:#000;background:#fff}#print-area table{width:100%;border-collapse:collapse}#print-area td,#print-area th{border:1px solid #999;padding:6px;text-align:left}}
@media(max-width:820px){
 input,select,textarea{font-size:16px}.btn{min-height:40px}.toasts{left:8px;right:8px}
 .side{position:fixed;left:-250px;z-index:90;transition:left .15s;width:240px}.side.open{left:0}.menu{display:inline-block}.view{padding:12px}
 .two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}
 .tbl.cards thead{display:none}.tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
 .tbl.cards tr{border-bottom:8px solid var(--bg);padding:6px 0}.tbl.cards td{border:0;padding:3px 12px;display:flex;justify-content:space-between;gap:12px;text-align:right}
 .tbl.cards td::before{content:attr(data-l);font-weight:600;color:var(--muted);text-align:left;flex:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Login page: red + green theme ===== */
.login{background:linear-gradient(135deg,#0d4a2b 0%,#117a43 38%,#7d1218 72%,#c0262d 100%)}
.login-card{border-top:0;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#1d9a58 0 50%,#c0262d 50% 100%)}
.login-card .logo{margin-top:6px;background:linear-gradient(90deg,#1d7a46,#b3261e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.login-card input:focus{outline:2px solid #1d9a58;outline-offset:1px}
.login-card .btn.gold{background:#1d9a58;border-color:#1d9a58;color:#fff}
.login-card .btn.gold:hover{background:#c0262d;border-color:#c0262d}
.login-card .alert.err{background:#fbdad7;color:#7a1c16;border-left:4px solid #c0262d}
.login-card .muted.small{color:#6b675d}

/* ===== INNER APP THEME: green + red ===== */
body{background:linear-gradient(180deg,#eef6f1 0,#f6faf8 260px,#f2f7f4 100%) fixed}
.bar{background:linear-gradient(90deg,var(--gold),var(--red))}
.toast{border-left-color:var(--gold2)}
.side{background:linear-gradient(180deg,#0a3a22 0%,#0f2f20 55%,#5e1117 100%);box-shadow:4px 0 18px rgba(0,0,0,.18)}
.side .logo{background:linear-gradient(90deg,#5ee09b,#ff7a80);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-size:16px}
.side a{color:#d8efe3;transition:background .15s,transform .15s}
.side a:hover{background:#ffffff1f;transform:translateX(2px)}
.side a.on{background:linear-gradient(90deg,#16a05a,#1fbf70);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(22,160,90,.4)}
.side .me{color:#cfe6d9}
.top{background:#fff;border-bottom:0;box-shadow:0 2px 10px rgba(12,42,27,.08);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold) 0 50%,var(--red) 50% 100%)}
.who{background:linear-gradient(90deg,#e4f6ec,#fde8ea);color:var(--ink);padding:5px 12px;border-radius:99px;font-weight:600}
.view h1{display:inline-block;background:linear-gradient(90deg,#0f6a3b,#c0262d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;position:relative}
.view h1::after{content:"";display:block;height:3px;margin-top:4px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--red))}
.view h2{color:var(--ink2);border-left:4px solid var(--gold);padding-left:9px}
.card{box-shadow:0 2px 10px rgba(12,42,27,.07);border-color:var(--line)}
.stat{border-top:4px solid var(--gold);transition:transform .15s,box-shadow .15s}
.stat .v{color:var(--ink)}
.stat.gold{border-top:4px solid var(--gold)}
.grid .stat:nth-child(4n+2){border-top-color:#f2b705}
.grid .stat:nth-child(4n+3){border-top-color:var(--gold)}
.grid .stat:nth-child(4n+4){border-top-color:var(--red)}
.stat.click:hover,.stat.click:focus{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 20px rgba(22,160,90,.25)}
.btn{background:var(--ink2);border-color:var(--ink2);color:#fff;border-radius:10px;transition:filter .15s,transform .1s}
.btn:hover{background:var(--ink);filter:brightness(1.1)}.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(135deg,#16a05a,#12884b);border-color:#12884b;color:#fff;box-shadow:0 3px 10px rgba(22,160,90,.35)}
.btn.gold:hover{background:linear-gradient(135deg,#1bb868,#16a05a)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:#b9d3c4}.btn.ghost:hover{background:#eaf6ef}
.btn.danger{background:linear-gradient(135deg,#d3262e,#b01c24);border-color:#b01c24;box-shadow:0 3px 10px rgba(211,38,46,.3)}
input:focus,select:focus,textarea:focus,.btn:focus{outline:2px solid var(--gold);outline-offset:1px}
.tbl{border-radius:var(--r);box-shadow:0 2px 10px rgba(12,42,27,.06)}
.tbl th{background:linear-gradient(180deg,#eaf6ef,#dcf0e5);color:#0f4a2c;border-bottom:2px solid #b9dcc8}
.tbl tbody tr:nth-child(even){background:#fafdfb}
.tbl tbody tr:hover{background:#eef9f2}
.tbl td{border-bottom:1px solid #e8f1ec}
.chip{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.chip.Pending,.chip.Unpaid,.chip.warn{background:#fff1c2;color:#7a5400}
.chip.Delivered,.chip.Paid,.chip.ok,.chip.Full{background:#cdf1dc;color:#0d6b34}
.chip.Return,.chip.bad,.chip.error{background:#ffd7da;color:#a3141c}
.chip.Cancel{background:#e3e7ea;color:#46525a}
.modal{border-top:0;position:relative;overflow:hidden;border-radius:16px}
.modal::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--gold) 0 50%,var(--red) 50% 100%)}
.modal .mh{background:#f4faf6}
.alert{background:#fff4d1;color:#6b4a00;border-left:4px solid #f2b705}
.alert.ok{background:#d4f3e1;color:#0d5a2b;border-left:4px solid var(--gold)}
.alert.err{border-left:4px solid var(--red)}
.pw{background:#f1faf5;border-color:var(--gold)}
.lnk{color:#0f7a43}.lnk:hover{color:var(--red)}
.demo{background:#fff1c2;color:#6b4a00}
/* tracking links */
a.trk{display:inline-block;background:linear-gradient(135deg,#16a05a,#12884b);color:#fff!important;font-weight:700;text-decoration:none;padding:4px 10px;border-radius:99px;word-break:break-all;box-shadow:0 2px 6px rgba(22,160,90,.35);transition:transform .1s,background .15s}
a.trk:hover{background:linear-gradient(135deg,#d3262e,#b01c24);transform:translateY(-1px)}
a.trk2{font-size:11.5px;color:var(--muted);text-decoration:underline}a.trk2:hover{color:var(--red)}

/* ===== motion / extra polish ===== */
.side .ico{display:inline-block;width:26px;font-size:15px}
.view.enter>*{animation:glRise .45s ease both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}
.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(n+5){animation-delay:.2s}
.view.enter .grid .stat{animation:glPop .5s cubic-bezier(.2,.9,.3,1.2) both}
.view.enter .grid .stat:nth-child(2){animation-delay:.06s}.view.enter .grid .stat:nth-child(3){animation-delay:.12s}
.view.enter .grid .stat:nth-child(4){animation-delay:.18s}.view.enter .grid .stat:nth-child(5){animation-delay:.24s}
@keyframes glRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glPop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.toast{animation:glSlide .35s ease both}
@keyframes glSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.ov{animation:glFade .2s ease both}.modal{animation:glRise .3s ease both}
@keyframes glFade{from{opacity:0}to{opacity:1}}
.login-card{animation:glRise .6s ease both}
.login-card .logo{animation:glGlow 3s ease-in-out infinite alternate}
@keyframes glGlow{from{filter:drop-shadow(0 0 0 rgba(22,160,90,0))}to{filter:drop-shadow(0 2px 6px rgba(211,38,46,.35))}}
.btn.gold,a.trk{position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.gold:hover::after{left:130%}
.tbl tbody tr{transition:background .15s,transform .15s}
.tbl tbody tr:hover{transform:scale(1.003);box-shadow:inset 4px 0 0 var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== LOGIN PAGE v2: premium look ===== */
.login{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:18px;
  background:linear-gradient(120deg,#052e1a,#0b6b3a,#1a8f50,#7a1018,#c0262d,#0b6b3a,#052e1a);background-size:400% 400%;animation:lgShift 18s ease infinite}
@keyframes lgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.lg-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:lgFloat 14s ease-in-out infinite alternate}
.o1{width:380px;height:380px;background:#22c777;left:-90px;top:-80px}
.o2{width:340px;height:340px;background:#ff3b45;right:-80px;bottom:-60px;animation-delay:-5s}
.o3{width:240px;height:240px;background:#ffd24d;left:45%;top:55%;opacity:.28;animation-delay:-9s}
@keyframes lgFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(50px,-40px) scale(1.15)}}
.fl{position:absolute;font-size:30px;opacity:.22;animation:lgRise 16s linear infinite;bottom:-60px}
.f1{left:8%;animation-duration:15s}.f2{left:22%;animation-duration:19s;animation-delay:-4s;font-size:36px}
.f3{left:40%;animation-duration:17s;animation-delay:-8s}.f4{left:58%;animation-duration:21s;animation-delay:-2s;font-size:26px}
.f5{left:74%;animation-duration:16s;animation-delay:-11s;font-size:38px}.f6{left:90%;animation-duration:20s;animation-delay:-6s}
@keyframes lgRise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(25deg)}}
.lg-wrap{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:56px;width:100%;max-width:1020px}
.lg-hero{flex:1 1 440px;color:#fff;min-width:0}
.lg-badge{display:inline-block;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);font-weight:700;letter-spacing:.16em;font-size:12px;backdrop-filter:blur(6px)}
.lg-title{font-size:clamp(38px,6vw,68px);line-height:1;margin:18px 0 12px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.35);-webkit-text-fill-color:#fff;background:none}
.lg-title::after{display:none}
.lg-title span{background:linear-gradient(90deg,#8bffbe,#ffb3b8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.lg-sub{font-size:17px;opacity:.92;margin:0 0 26px;max-width:430px}
.lg-feat{list-style:none;padding:0;margin:0 0 28px;display:grid;gap:12px;max-width:430px}
.lg-feat li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);transition:transform .2s,background .2s;animation:lgIn .7s ease both}
.lg-feat li:nth-child(2){animation-delay:.12s}.lg-feat li:nth-child(3){animation-delay:.24s}
.lg-feat li:hover{transform:translateX(8px);background:rgba(255,255,255,.2)}
.lg-feat b{font-size:24px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18)}
.lg-feat strong{display:block;font-size:15px}.lg-feat small{opacity:.85;font-size:12.5px}
@keyframes lgIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.lg-road{position:relative;height:34px;max-width:430px;border-bottom:3px dashed rgba(255,255,255,.4);overflow:hidden}
.lg-road .truck{position:absolute;bottom:-2px;left:-50px;font-size:30px;animation:lgDrive 7s linear infinite}
@keyframes lgDrive{from{left:-50px}to{left:100%}}
/* the card */
.login-card{flex:0 0 400px;max-width:100%;width:100%;padding:34px 30px 26px;border-radius:26px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  box-shadow:0 30px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.5) inset;animation:lgCard .8s cubic-bezier(.2,.9,.3,1.1) both;text-align:center}
@keyframes lgCard{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.login-card::before{height:7px}
.lg-avatar{width:74px;height:74px;margin:2px auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;
  background:linear-gradient(135deg,#16a05a,#d3262e);box-shadow:0 10px 26px rgba(22,160,90,.45);animation:lgPulse 2.6s ease-in-out infinite}
@keyframes lgPulse{0%,100%{box-shadow:0 10px 26px rgba(22,160,90,.45)}50%{box-shadow:0 10px 36px rgba(211,38,46,.55)}}
.login-card .logo{font-size:17px;letter-spacing:.34em;margin:0}
.lg-hi{margin:8px 0 2px;font-size:22px;color:#0c2a1b;-webkit-text-fill-color:#0c2a1b;background:none;border:0;padding:0}
.lg-note{margin:0 0 10px;font-size:13.5px}
.login-card .alert{text-align:left}
.lg-field{text-align:left;font-size:12.5px;font-weight:700;color:#35513f;margin:14px 0 0;letter-spacing:.03em}
.lg-in{position:relative;display:block;margin-top:6px}
.lg-in i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:16px;opacity:.75;pointer-events:none}
