<script>
(function () {
'use strict';
var S = { token: null, meta: null, view: '', f: { orders: { page: 1 }, audit: { page: 1 }, sorders: { page: 1 } }, cache: {} };
var $ = function (s, r) { return (r || document).querySelector(s); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return (n === '' || n == null) ? '—' : 'Rs ' + Number(n).toLocaleString('en-PK', { maximumFractionDigits: 2 }); }
function chip(s) { return '<span class="chip ' + esc(s) + '">' + esc(s) + '</span>'; }
function uid(p) { var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a); return p + Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
function isAdmin() { return S.meta && S.meta.user.role === 'admin'; }
function isStaff() { return S.meta && S.meta.user.role === 'staff'; }
function homeView() { return isAdmin() ? 'dash' : (isStaff() ? 'stdash' : 'sdash'); }
function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

/* ---------- server calls ---------- */
var busyN = 0;
function busy(d) { busyN += d; $('#bar').hidden = busyN <= 0; }
function call(action, payload) {
  return new Promise(function (res, rej) {
    busy(1);
    google.script.run
      .withSuccessHandler(function (r) {
        busy(-1);
        if (r && r.ok) return res(r.data);
        if (r && r.code === 'AUTH') signOutLocal(r.error);
        var e = new Error((r && r.error) || 'Request failed'); e.code = r && r.code; rej(e);
      })
      .withFailureHandler(function () { busy(-1); rej(new Error('Connection problem. Please check your internet and retry.')); })
      .api(S.token, action, payload || {});
  });
}
function toast(msg, err) {
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').appendChild(t);
  setTimeout(function () { t.remove(); }, err ? 7000 : 3500);
}
function fail(e) { toast(e.message || 'Error', true); }

/* ---------- modals ---------- */
var modals = [];
function modal(o) {
  var ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="modal ' + (o.wide ? 'wide' : '') + '" role="dialog" aria-modal="true"><div class="mh"><h3>' + esc(o.title) + '</h3><button class="btn ghost sm" data-x aria-label="Close">✕</button></div><div class="mb">' + o.html + '</div><div class="mf"></div></div>';
  var m = { el: ov, close: function () { ov.remove(); modals = modals.filter(function (x) { return x !== m; }); } };
  (o.actions || []).forEach(function (a) {
    var b = document.createElement('button'); b.className = 'btn ' + (a.cls || ''); b.textContent = a.label;
    b.onclick = function () { var r = a.fn(m, b); if (r && r.then) { b.disabled = true; r.then(function () { b.disabled = false; }, function () { b.disabled = false; }); } };
    $('.mf', ov).appendChild(b);
  });
  ov.addEventListener('click', function (e) { if (e.target === ov || e.target.hasAttribute('data-x')) m.close(); });
  $('#modals').appendChild(ov); modals.push(m);
  var f = $('input,select,textarea', ov); if (f) f.focus();
  return m;
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modals.length) modals[modals.length - 1].close(); });
function confirmDlg(msg, label, danger) {
  return new Promise(function (res) {
    modal({ title: 'Please confirm', html: '<p>' + esc(msg) + '</p>', actions: [
      { label: 'Cancel', cls: 'ghost', fn: function (m) { m.close(); res(false); } },
      { label: label || 'Confirm', cls: danger ? 'danger' : 'gold', fn: function (m) { m.close(); res(true); } }] });
  });
}
function vals(root) {
  var o = {}; root.querySelectorAll('[name]').forEach(function (el) { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return o;
}

/* ---------- form builders ---------- */
function field(label, name, val, extra) { return '<label>' + esc(label) + '<input name="' + name + '" value="' + esc(val) + '" ' + (extra || '') + '></label>'; }
var COURIER_DEFAULTS = ['TCS', 'Leopards', 'PostEx', 'Post Office'];
function combo(label, name, opts, val, ph) {
  var seen = {}, list = [];
  (opts || []).forEach(function (x) { var k = String(x).trim().toLowerCase(); if (k && !seen[k]) { seen[k] = 1; list.push(String(x).trim()); } });
  return '<label>' + esc(label) + '<input name="' + name + '" value="' + esc(val) + '" list="dl_' + name + '" placeholder="' + esc(ph || '') + '" autocomplete="off"><datalist id="dl_' + name + '">' +
    list.map(function (x) { return '<option value="' + esc(x) + '"></option>'; }).join('') + '</datalist></label>';
}
function sel(label, name, opts, val, blank) {
  var h = '<label>' + esc(label) + '<select name="' + name + '">' + (blank != null ? '<option value="">' + esc(blank) + '</option>' : '');
  opts.forEach(function (o) { var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; h += '<option value="' + esc(v) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + esc(l) + '</option>'; });
  return h + '</select></label>';
}
function salesmenOpts(activeOnly) { return S.meta.salesmen.filter(function (s) { return !activeOnly || s.active; }).map(function (s) { return [s.id, s.name + (s.active ? '' : ' (inactive)')]; }); }
function pager(p, key) {
  return '<div class="pager"><span class="muted small">' + p.total + ' result' + (p.total === 1 ? '' : 's') + ' · page ' + p.page + ' of ' + p.pages + '</span><span>' +
    '<button class="btn ghost sm" data-act="pg" data-k="' + key + '" data-d="-1"' + (p.page <= 1 ? ' disabled' : '') + '>‹ Prev</button> ' +
    '<button class="btn ghost sm" data-act="pg" data-k="' + key + '" data-d="1"' + (p.page >= p.pages ? ' disabled' : '') + '>Next ›</button></span></div>';
}
function drillAttrs(drill) { var at = ''; Object.keys(drill).forEach(function (x) { if (drill[x] !== '' && drill[x] != null) at += ' data-' + x + '="' + esc(drill[x]) + '"'; }); return at + ' data-act="drill"'; }
function stat(k, v, b, gold, drill) {
  return '<div class="card stat' + (gold ? ' gold' : '') + (drill ? ' click' : '') + '"' + (drill ? drillAttrs(drill) + ' role="button" tabindex="0" title="Tap to see these orders"' : '') + '><div class="k">' + esc(k) + '</div><div class="v">' + v + '</div>' + (b ? '<div class="b">' + esc(b) + '</div>' : '') + '</div>';
}
/* ---------- graphs ---------- */
var C_G = '#16a05a', C_R = '#d3262e', C_Y = '#f2b705', C_N = '#8a97a0';
function ringSvg(p, c1, c2, id) {
  p = Math.max(0, Math.min(100, p || 0)); var C = 2 * Math.PI * 54;
  return '<svg viewBox="0 0 140 140" class="ring"><defs><linearGradient id="gr' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs>' +
    '<circle cx="70" cy="70" r="54" class="rg-bg"/><circle cx="70" cy="70" r="54" class="rg-fg" stroke="url(#gr' + id + ')" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - p / 100)).toFixed(2) + '" style="--full:' + C.toFixed(2) + '" transform="rotate(-90 70 70)"/>' +
    '<text x="70" y="78" text-anchor="middle" class="rg-t">' + Math.round(p) + '%</text></svg>';
}
function donutSvg(parts, total) {
  var C = 2 * Math.PI * 54, acc = 0, h = '<svg viewBox="0 0 140 140" class="ring"><circle cx="70" cy="70" r="54" class="rg-bg" style="stroke-width:18"/>';
  if (total > 0) parts.forEach(function (x) {
    if (!x.v) return; var len = C * x.v / total;
    h += '<circle cx="70" cy="70" r="54" fill="none" stroke="' + x.c + '" stroke-width="18" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) + '" transform="rotate(-90 70 70)" class="dn-seg"><title>' + esc(x.l) + ': ' + x.v + '</title></circle>'; acc += len;
  });
  return h + '<text x="70" y="70" text-anchor="middle" class="dn-n">' + total + '</text><text x="70" y="88" text-anchor="middle" class="dn-l">orders</text></svg>';
}
function daysSvg(days) {
  var W = 700, H = 240, pl = 12, pb = 38, pt = 24, ch = H - pb - pt, n = days.length, bw = (W - pl * 2) / n, max = 1, h;
  days.forEach(function (d) { max = Math.max(max, d.total); });
  h = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="dsvg">';
  for (var g = 0; g <= 4; g++) { var gy = pt + ch - ch * g / 4; h += '<line x1="' + pl + '" x2="' + (W - pl) + '" y1="' + gy + '" y2="' + gy + '" class="gl"/>' + (g ? '<text x="' + (pl + 2) + '" y="' + (gy - 3) + '" class="gt">' + Math.round(max * g / 4) + '</text>' : ''); }
  days.forEach(function (d, i) {
    var x = pl + i * bw + bw * 0.16, w = bw * 0.68, y = pt + ch, delay = (i * 0.04).toFixed(2);
    [['delivered', C_G], ['returns', C_R], ['pending', C_Y], ['cancel', C_N]].forEach(function (sg) {
      var v = d[sg[0]]; if (!v) return; var hh = v / max * ch; y -= hh;
      h += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="3" fill="' + sg[1] + '" class="bseg" style="animation-delay:' + delay + 's"><title>' + esc(d.d) + ' · ' + sg[0] + ': ' + v + '</title></rect>';
    });
    if (d.total) h += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" class="bv">' + d.total + '</text>';
    h += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 18) + '" text-anchor="middle" class="bl">' + esc(d.d.slice(8)) + '</text>' + (d.d.slice(8) === '01' || i === 0 ? '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" class="bl2">' + esc(d.d.slice(5, 7)) + '/' + esc(d.d.slice(2, 4)) + '</text>' : '');
  });
  return h + '</svg>';
}
function hbars(rows) {
  var max = 1; rows.forEach(function (r) { max = Math.max(max, r.total); });
  return rows.map(function (r, i) {
    function seg(v, c, t) { return v ? '<span class="hb-s" style="width:' + (v / max * 100).toFixed(1) + '%;background:' + c + ';animation-delay:' + (i * 0.06).toFixed(2) + 's" title="' + t + ': ' + v + '"></span>' : ''; }
    return '<div class="hb"><div class="hb-n" title="' + esc(r.name) + '">' + esc(r.name) + '</div><div class="hb-t">' + seg(r.delivered, C_G, 'Delivered') + seg(r.returns, C_R, 'Return') + seg(r.pending, C_Y, 'Pending') + seg(r.cancel || 0, C_N, 'Cancel') + '</div><div class="hb-v">' + r.total + '</div></div>';
  }).join('') || '<p class="muted small">Abhi data nahi hai.</p>';
}
function legend() { return '<div class="lgd"><i style="background:' + C_G + '"></i>Delivered <i style="background:' + C_R + '"></i>Return <i style="background:' + C_Y + '"></i>Pending <i style="background:' + C_N + '"></i>Cancel</div>'; }
function chartsHtml(d, admin) {
  var s = d.stats, ch = d.charts || { days: [], couriers: [], months: [] }, dl = s.delivered, rt = s.returns, closed = dl + rt;
  var pD = closed ? dl / closed * 100 : 0, pR = closed ? rt / closed * 100 : 0;
  var h = '<h2>Graphs</h2><div class="gwrap">';
  h += '<div class="gcard gfull dr"><div class="dr-side dr-g"><div class="dr-h">&#9989; Delivered</div>' + ringSvg(pD, '#4ae08f', '#0f7a43', 'd') + '<div class="dr-n">' + dl + '</div><div class="dr-s">Success rate</div></div>' +
    '<div class="dr-mid"><div class="dr-vs">VS</div><div class="dr-split"><span class="g" style="width:' + pD.toFixed(1) + '%"></span><span class="r" style="width:' + pR.toFixed(1) + '%"></span></div><div class="dr-note">' + closed + ' closed orders (Delivered + Return)</div></div>' +
    '<div class="dr-side dr-r"><div class="dr-h">&#8617;&#65039; Return</div>' + ringSvg(pR, '#ff6b72', '#b01c24', 'r') + '<div class="dr-n">' + rt + '</div><div class="dr-s">Return rate</div></div></div>';
  h += '<div class="gcard"><h3>Order status</h3><div class="dn-wrap">' + donutSvg([{ v: dl, c: C_G, l: 'Delivered' }, { v: rt, c: C_R, l: 'Return' }, { v: s.pending, c: C_Y, l: 'Pending' }, { v: s.cancelled, c: C_N, l: 'Cancel' }], s.total) +
    '<ul class="dn-lg"><li><i style="background:' + C_G + '"></i>Delivered <b>' + dl + '</b></li><li><i style="background:' + C_R + '"></i>Return <b>' + rt + '</b></li><li><i style="background:' + C_Y + '"></i>Pending <b>' + s.pending + '</b></li><li><i style="background:' + C_N + '"></i>Cancel <b>' + s.cancelled + '</b></li></ul></div></div>';
  h += '<div class="gcard"><h3>Courier ke hisaab se</h3>' + hbars(ch.couriers) + legend() + '</div>';
  h += '<div class="gcard gfull"><h3>Pichhle 14 din ke orders</h3><div class="wrap">' + daysSvg(ch.days) + '</div>' + legend() + (ch.undated ? '<p class="muted small">' + ch.undated + ' orders par date nahi likhi, wo is graph mein shamil nahi.</p>' : '') + '</div>';
  if (admin) {
    var sm = (d.salesmen || []).map(function (r) { return { name: r.name, total: r.total, delivered: r.delivered, returns: r.returns, pending: r.pending, cancel: 0 }; }).sort(function (a, b) { return b.total - a.total; }).slice(0, 8);
    h += '<div class="gcard"><h3>Salesman performance</h3>' + hbars(sm) + legend() + '</div>';
    var mx = 1; (ch.months || []).forEach(function (m) { mx = Math.max(mx, m.sales || 0, Math.abs(m.profit || 0)); });
    h += '<div class="gcard"><h3>Month wise Sales aur Profit</h3>' + ((ch.months || []).map(function (m, i) {
      return '<div class="mb"><div class="mb-n">' + esc(m.tab) + '</div><div class="mb-r"><span class="mb-s" style="width:' + ((m.sales || 0) / mx * 100).toFixed(1) + '%;animation-delay:' + (i * 0.08).toFixed(2) + 's"></span><em>' + money(m.sales || 0) + '</em></div><div class="mb-r"><span class="mb-p" style="width:' + (Math.abs(m.profit || 0) / mx * 100).toFixed(1) + '%;animation-delay:' + (i * 0.08 + 0.04).toFixed(2) + 's' + ((m.profit || 0) < 0 ? ';background:linear-gradient(90deg,#ff6b72,#b01c24)' : '') + '"></span><em>' + money(m.profit || 0) + '</em></div></div>';
    }).join('') || '<p class="muted small">Abhi data nahi hai.</p>') + '<div class="lgd"><i style="background:' + C_G + '"></i>Sales <i style="background:#f2b705"></i>Profit</div></div>';
  }
  return h + '</div>';
}
function lnk(text, drill) { return '<a class="lnk"' + drillAttrs(drill) + ' role="button" tabindex="0">' + text + '</a>'; }
function ext(a, b) { var o = {}; Object.keys(a).forEach(function (k) { o[k] = a[k]; }); Object.keys(b).forEach(function (k) { o[k] = b[k]; }); return o; }

/* ---------- CSV ---------- */
function csvCell(v) {
  if (v == null) return '';
  var s = String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(name, rows) {
  var text = '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  var url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

/* ---------- session ---------- */
function signOutLocal(msg) {
  S.token = null; S.meta = null; store('gl_token', null); $('#app').hidden = true; $('#login').hidden = false; $('#modals').innerHTML = '';
  var e = $('#login-err'); if (msg) { e.textContent = msg; e.hidden = false; } else e.hidden = true;
}
function doLogin() {
  var u = $('#lu').value, p = $('#lp').value, e = $('#login-err'); e.hidden = true;
  $('#lb').disabled = true;
  call('login', { username: u, password: p }).then(function (d) { S.token = d.token; store('gl_token', d.token); $('#lp').value = ''; return start(); })
    .catch(function (err) { e.textContent = err.message; e.hidden = false; }).then(function () { $('#lb').disabled = false; });
}
function start() {
  return call('meta').then(function (m) {
    S.meta = m; $('#login').hidden = true; $('#app').hidden = false; $('#demo').hidden = !m.demo;
    $('#who').textContent = m.user.displayName + ' · ' + m.user.role; renderSide();
    if (m.user.mustChange) { passwordModal(true); return; }
    go(homeView());
  });
}
function passwordModal(forced) {
  modal({ title: forced ? 'Set a new password' : 'Change password', html: (forced ? '<div class="alert">You must choose a new password before continuing.</div>' : '') +
    '<label>Current password<input type="password" name="oldPassword" autocomplete="current-password"></label>' +
    '<label>New password (10+ characters, letters and numbers)<input type="password" name="newPassword" autocomplete="new-password"></label>' +
    '<label>Repeat new password<input type="password" name="again" autocomplete="new-password"></label>',
    actions: (forced ? [] : [{ label: 'Cancel', cls: 'ghost', fn: function (m) { m.close(); } }]).concat([{ label: 'Save password', cls: 'gold', fn: function (m) {
      var v = vals(m.el); if (v.newPassword !== v.again) { toast('The new passwords do not match.', true); return; }
      return call('changePassword', { oldPassword: v.oldPassword, newPassword: v.newPassword }).then(function () { m.close(); toast('Password changed.'); S.meta.user.mustChange = false; go(homeView()); }).catch(fail);
    } }]) });
}

/* ---------- navigation ---------- */
var NAV = {
  admin: [['dash', 'Dashboard'], ['orders', 'Orders'], ['pay', 'Salesman Payments'], ['riders', 'Riders'], ['policy', 'Policy & Rules'], ['team', 'Team Logins'], ['settings', 'Settings'], ['audit', 'Activity Log']],
  staff: [['stdash', 'Dashboard'], ['orders', 'Orders'], ['sriders', 'Riders & Contact']],
  salesman: [['sdash', 'My Dashboard'], ['sorders', 'My Orders'], ['spay', 'My Payments'], ['sriders', 'Riders & Contact'], ['spolicy', 'Rules & Policy']]
};
var BRAND_NAME = 'Z. STORE';   // sidebar ka naam; badalna ho to yahan likhein
var NAV_ICON = { dash: '&#128202;', sdash: '&#128202;', stdash: '&#128202;', orders: '&#128230;', sorders: '&#128230;', pay: '&#128176;', spay: '&#128176;', riders: '&#127949;', sriders: '&#127949;', policy: '&#128220;', spolicy: '&#128220;', team: '&#128101;', settings: '&#9881;&#65039;', audit: '&#128221;' };
function renderSide() {
  var items = NAV[S.meta.user.role];
  $('#side').innerHTML = '<div class="logo">' + esc(BRAND_NAME) + '</div>' + items.map(function (n) { return '<a data-act="nav" data-v="' + n[0] + '" id="nav-' + n[0] + '"><span class="ico">' + (NAV_ICON[n[0]] || '&#9679;') + '</span>' + esc(n[1]) + '</a>'; }).join('') +
    '<div class="grow"></div><div class="me">' + esc(S.meta.user.displayName) + '</div><a data-act="pwd"><span class="ico">&#128273;</span>Password badlein</a><a data-act="logout"><span class="ico">&#128682;</span>Sign out</a>';
}
function go(v) {
  S.view = v; document.querySelectorAll('.side a').forEach(function (a) { a.classList.toggle('on', a.id === 'nav-' + v); });
  $('#side').classList.remove('open');
  var fn = VIEWS[v]; $('#view').innerHTML = '<p class="muted">Loading…</p>'; if (fn) fn(); $('#view').focus();
}
function setView(h) {
  var v = $('#view'); v.innerHTML = h;
  try { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); countUp(v); } catch (e) {}
}
/* Dashboard ke numbers 0 se upar chadhte hain (sirf dikhawa; asli value wahi rehti hai) */
function countUp(root) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.stat .v').forEach(function (el) {
    var txt = el.textContent.trim(), m = /^(\D*?)(\d[\d,]*(?:\.\d+)?)(\D*)$/.exec(txt);
    if (!m) return;
    var end = Number(m[2].replace(/,/g, '')); if (!isFinite(end) || end <= 0 || end > 1e9) return;
    var dec = (m[2].split('.')[1] || '').length, t0 = null, dur = 750;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3), cur = p < 1 ? end * e : end;
      el.textContent = m[1] + cur.toLocaleString('en-PK', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3];
      if (p < 1) requestAnimationFrame(step); else el.textContent = txt;
    }
    requestAnimationFrame(step);
  });
}
function day(s) { return String(s || '').slice(0, 10); }
function tel(n) { return n ? '<a href="tel:' + esc(String(n).replace(/[^\d+]/g, '')) + '">' + esc(n) + '</a>' : '<span class="muted">—</span>'; }
/* ===== TRACKING LINK: number par click = courier ki apni tracking site khulti hai ======
   {n} wale link mein tracking number khud lag jata hai. Jin pages par number URL mein nahi lag sakta
   (Leopards, PostEx), wahan click par number copy ho jata hai, page mein paste kar dein.
   Naya courier add karna ho to TRACK_URLS mein ek line barha dein. */
var TRACK_URLS = [
  { re: /tcs/i,                        name: 'TCS',           direct: 'https://www.tcsexpress.com/track/{n}', official: '' },
  { re: /leopard|lcs/i,                name: 'Leopards',      direct: 'https://lcstracking.com/?cn={n}', official: 'https://pk.leopardscourier.com/tracking', label: 'official Leopards page' },
  { re: /post ?ex/i,                   name: 'PostEx',        direct: 'https://postextracking.pk/track/{n}', official: 'https://postextracking.com.pk/', label: 'dusri tracking site' },
  { re: /post ?office|pak(istan)? ?post|^post$|\bems\b|\bums\b/i, name: 'Post Office', direct: 'https://ep.gov.pk/emtts/EPTrack_Live.aspx?ArticleIDz={n}', official: 'https://ep.gov.pk/track.asp' }

function trackInfo(courier) {

      (d.logs.length ? d.logs.map(function (l) { return '<tr><td data-l="Log" class="mono">' + esc(l.LogID) + '</td><td data-l="Date">' + esc(l.PaidDate) + '</td><td data-l="Salesman">' + esc(l.Salesman) + '</td><td data-l="Orders">' + l.OrderCount + '</td><td data-l="Amount">' + money(l.Amount) + '</td><td data-l="Note">' + esc(l.Note) + '</td><td data-l="Status"><span class="chip ' + (l.Status === 'Paid' ? 'ok' : 'warn') + '">' + esc(l.Status) + '</span></td><td>' + (l.Status === 'Paid' ? '<button class="btn ghost sm" data-act="undoPay" data-id="' + esc(l.LogID) + '">Undo</button>' : '') + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="muted">No payments yet.</td></tr>') + '</tbody></table></div>' +
      '<h2>Previous payments (already paid)</h2><div class="card"><p>If you already paid a salesman for old months, mark those months as <b>Paid</b> here so they do not show as Pending. You will see a preview (who and how much) before anything changes.</p>' +
      '<p><button class="btn ghost sm" data-act="bulkOld">Select all months before this month</button> <button class="btn ghost sm" data-act="bulkNone">Clear</button></p>' +
      '<div class="two"><div>' + S.meta.tabs.map(function (t) { return '<label style="font-weight:400"><input type="checkbox" data-bulk="' + esc(t) + '"> ' + esc(t) + '</label>'; }).join('') + '</div><div>' + sel('For which salesman', 'bulkSalesman', S.meta.allSalesmen, '', 'All salesmen') + field('Payment date (when it was paid)', 'bulkDate', S.meta.today, 'type="date"') + '</div></div><button class="btn gold" data-act="bulkPaid">Preview</button></div>' +
      '<p class="muted small">Tip: you can also type <b>Paid</b> in the "Saleman Payment" column of the sheet; the app understands that too. Do not tick months of a salesman whose old commission is still pending.</p>');
  }).catch(fail);
};
function payModal(name) {
  call('ad_payDetail', { salesman: name }).then(function (d) {
    var reqId = uid('pay-');
    var h = '<p><b>' + esc(name) + '</b> — Pending: <b>' + money(d.total) + '</b> (' + d.items.length + ' orders, oldest first)</p>' +
      '<div class="two"><label>Amount paying now (Rs)<input id="pm-amt" inputmode="decimal" placeholder="e.g. 10000"></label><label>Selected total<input id="pm-tot" readonly></label>' + field('Payment date', 'paymentDate', S.meta.today, 'type="date"') + field('Note', 'note', '') + '</div>' +
      '<p class="muted small">Type the amount and the oldest orders are selected automatically, up to that amount. You can also tick orders yourself. Orders you do not select stay Pending.</p>' +
      '<p><input id="pm-q" placeholder="Search customer, phone, order no, tracking, product…"></p>' +
      '<div class="wrap"><table class="tbl" id="pm-tbl"><thead><tr><th><input type="checkbox" id="pm-all" checked></th><th>Month</th><th>Customer / Phone</th><th>Product</th><th>Order No / Tracking</th><th>Delivered</th><th>Commission</th></tr></thead><tbody>' +
      d.items.map(function (o) {
        var hay = [o.tab, o.customer, o.phone, o.product, o.orderNo, o.tracking].join(' ').toLowerCase();
        return '<tr data-s="' + esc(hay) + '"><td><input type="checkbox" data-ref="' + esc(o.ref) + '" data-c="' + o.comm + '" checked></td><td>' + esc(o.tab) + '</td><td><b>' + esc(o.customer) + '</b><br>' + esc(o.phone) + '</td><td>' + esc(o.product) + '</td><td><b class="mono">' + esc(o.orderNo || '—') + '</b><br><span class="muted small mono">' + esc(o.tracking || '—') + '</span></td><td>' + esc(o.delivered || '—') + '</td><td><b>' + money(o.comm) + '</b></td></tr>';
      }).join('') + '</tbody></table></div>';
    var m = modal({ title: 'Pay salesman', wide: true, html: h, actions: [{ label: 'Cancel', cls: 'ghost', fn: function (x) { x.close(); } }, { label: 'Mark as Paid', cls: 'gold', fn: function (x) {
      var refs = [], tot = 0; x.el.querySelectorAll('[data-ref]').forEach(function (c) { if (c.checked) { refs.push(c.dataset.ref); tot += +c.dataset.c; } });
      if (!refs.length) { toast('Select at least one order.', true); return; }
      var v = vals(x.el);
      return confirmDlg('Mark ' + refs.length + ' orders (' + money(Math.round(tot * 100) / 100) + ') as Paid for ' + name + '? "Paid", yellow colour and the date will be written in the sheet.', 'Mark as Paid').then(function (ok) {
        if (!ok) return;
        return call('ad_payConfirm', { salesman: name, refs: refs, paymentDate: v.paymentDate, note: v.note, requestId: reqId }).then(function (r) { x.close(); toast('Payment ' + r.log.LogID + ' recorded: ' + money(r.log.Amount)); S.view === 'pay' ? VIEWS.pay() : VIEWS.dash(); })
          .catch(function (e) { fail(e); x.close(); payModal(name); });
      });
    } }] });
    var recalc = function () { var t = 0; m.el.querySelectorAll('[data-ref]').forEach(function (c) { if (c.checked) t += +c.dataset.c; }); $('#pm-tot', m.el).value = Math.round(t * 100) / 100; };
    m.el.addEventListener('change', function (e) {
      if (e.target.id === 'pm-all') { m.el.querySelectorAll('#pm-tbl tbody tr').forEach(function (tr) { if (tr.style.display !== 'none') tr.querySelector('[data-ref]').checked = e.target.checked; }); recalc(); }
      else if (e.target.hasAttribute('data-ref')) recalc();
    });
    m.el.addEventListener('input', function (e) {
      if (e.target.id === 'pm-q') { var q = e.target.value.toLowerCase().trim(); m.el.querySelectorAll('#pm-tbl tbody tr').forEach(function (tr) { tr.style.display = (!q || tr.dataset.s.indexOf(q) >= 0) ? '' : 'none'; }); return; }
      if (e.target.id !== 'pm-amt') return; var amt = Number(e.target.value) || 0, run = 0;
      m.el.querySelectorAll('[data-ref]').forEach(function (c) { var v = +c.dataset.c; if (amt > 0 && run + v <= amt + 0.001) { c.checked = true; run += v; } else c.checked = !(amt > 0) ? c.checked : false; }); recalc();
    });
    recalc();
  }).catch(fail);
}

  nav: function (d) { go(d.v); },
  drill: function (d) {

    if (isAdmin() || isStaff()) { S.f.orders = f; go('orders'); } else { S.f.sorders = f; go('sorders'); }
  },
  logout: function () { call('logout').catch(function () {}).then(function () { signOutLocal(''); }); },
  pwd: function () { passwordModal(false); },
  pg: function (d) { S.f[d.k].page += +d.d; VIEWS[d.k](); },
  applyf: function (d) { readFilter(d.k); VIEWS[d.k](); },
  clearf: function (d) { S.f[d.k] = { page: 1 }; VIEWS[d.k](); },
  setSt: function (d) { confirmDlg(d.c + ' ka order ' + d.s + ' mark karein? Yeh final hai; baad mein sirf admin badal sakta hai.', d.s + ' mark karein').then(function (ok) { if (ok) call('sm_setStatus', { ref: d.ref, status: d.s }).then(function () { toast('Status update ho gaya.'); VIEWS.sorders(); }).catch(function (e) { fail(e); VIEWS.sorders(); }); }); },
  newMonth: function () {
    var months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'], t = S.meta.today.split('-');
    modal({ title: 'Naye mahine ka tab', html: '<p>Naya tab pichle mahine ke tab ki saaf copy hoga: header, dropdowns aur DC/Profit ke formulas ke saath, lekin koi order nahi.</p>' + sel('Mahina', 'month', months, months[+t[1] - 1]) + field('Saal', 'year', t[0], 'inputmode="numeric"'),
      actions: [{ label: 'Cancel', cls: 'ghost', fn: function (m) { m.close(); } }, { label: 'Tab banayein', cls: 'gold', fn: function (m) { var v = vals(m.el); return call('ad_createMonthTab', { name: v.month + ' ' + v.year }).then(function (r) { m.close(); toast(r.name + ' ban gaya.'); return call('meta').then(function (mm) { S.meta = mm; VIEWS.orders(); }); }).catch(fail); } }] });
  },
  newOrder: function () { orderModal(null); }, editOrder: function (d) { orderModal(S.cache.orders[d.ref]); }, exportOrders: exportOrders,
  payOne: function (d) { payModal(d.n); },
  toggleSwitch: function () { var on = !S.meta.statusSwitch; confirmDlg(on ? 'Salesmen ko Delivered/Return karne ki ijazat dein?' : 'Salesmen ka status badalna band karein?', on ? 'ON karein' : 'OFF karein').then(function (ok) { if (ok) call('ad_setStatusSwitch', { on: on }).then(function (r) { S.meta.statusSwitch = r.on; toast('Salesman status switch ' + (r.on ? 'ON' : 'OFF') + ' ho gaya.'); go(S.view); }).catch(fail); }); },
  bulkOld: function () { var before = S.meta.tabsBeforeCurrent || []; document.querySelectorAll('[data-bulk]').forEach(function (c) { c.checked = before.indexOf(c.dataset.bulk) >= 0; }); },
  bulkNone: function () { document.querySelectorAll('[data-bulk]').forEach(function (c) { c.checked = false; }); },
  undoPay: function (d) { confirmDlg('Undo payment ' + d.id + '? The Paid mark and date will be removed from these orders in the sheet.', 'Undo', true).then(function (ok) { if (ok) call('ad_undoPayment', { logId: d.id }).then(function (r) { toast(r.undone + ' orders are Pending again' + (r.skipped ? ' (' + r.skipped + ' skipped)' : '') + '.'); VIEWS.pay(); }).catch(fail); }); },
  bulkPaid: function () {
    var tabs = []; document.querySelectorAll('[data-bulk]').forEach(function (c) { if (c.checked) tabs.push(c.dataset.bulk); });

    call('ad_bulkPreview', { tabs: tabs, salesman: who }).then(function (pv) {

        '<div class="wrap"><table class="tbl"><thead><tr><th>Salesman</th><th>Orders</th><th>Commission</th></tr></thead><tbody>' + pv.rows.map(function (r) { return '<tr><td><b>' + esc(r.name) + '</b></td><td>' + r.count + '</td><td>' + money(r.amount) + '</td></tr>'; }).join('') + '<tr><td><b>Total</b></td><td><b>' + pv.count + '</b></td><td><b>' + money(pv.amount) + '</b></td></tr></tbody></table></div>' +

      actions: [{ label: 'Cancel', cls: 'ghost', fn: function (m) { m.close(); } }, { label: 'Banayein', cls: 'gold', fn: function (m) { var v = vals(m.el); return call('ad_createUser', { username: v.username, displayName: (v.role === 'salesman' ? (v.pick || v.typed) : (v.typed || v.pick)), role: v.role }).then(function (r) { m.close(); VIEWS.team(); showTempPw('Login ban gaya', r.user.username, r.tempPassword); }).catch(fail); } }] });

  revoke: function (d) { call('ad_revokeSessions', { userId: d.id }).then(function () { toast('Sign out ho gaya.'); }).catch(fail); },
  toggleUser: function (d) { var u = S.cache.users[d.id]; confirmDlg((u.active ? 'Band karein: ' : 'Chalu karein: ') + u.displayName + '?', 'Haan').then(function (ok) { if (ok) call('ad_setActive', { userId: d.id, active: !u.active }).then(function () { VIEWS.team(); }).catch(fail); }); },

  payOne2: function () {}
};
document.addEventListener('click', function (e) { var t = e.target.closest('[data-act]'); if (!t || t.disabled) return; var fn = A[t.dataset.act]; if (fn) { e.preventDefault(); fn(t.dataset, t); } });
document.addEventListener('change', function (e) {
  var el = e.target, bar = el.closest && el.closest('[data-fk]');
  if (bar && el.hasAttribute('data-f') && (el.tagName === 'SELECT' || el.type === 'date')) { var b = bar.querySelector('[data-act=applyf]'); if (b) b.click(); }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.hasAttribute('data-act')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('[data-fk]')) { var b = e.target.closest('[data-fk]').querySelector('[data-act=applyf]'); if (b) b.click(); } });
document.addEventListener('input', function (e) {
  if (e.target.id !== 'g-q') return; var q = e.target.value.toLowerCase();
  document.querySelectorAll('#g-tbl tbody tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) < 0 ? 'none' : ''; });
});
$('#menu').onclick = function () { $('#side').classList.toggle('open'); };
$('#lb').onclick = doLogin;
$('#lp').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

/* ---------- boot ---------- */
var saved = load('gl_token');
if (saved) { S.token = saved; start().catch(function () { signOutLocal(''); }); } else { $('#login').hidden = false; }
})();
